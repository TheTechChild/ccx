[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app. Users install with
# `mise use -g github:TheTechChild/ccx`, which reads the archives.
installers = []
# Target platforms to build apps for (Rust target-triple syntax).
# ccx uses Unix APIs, so there is no Windows target.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Where to host releases
hosting = "github"
# The archive format for macOS and Linux
unix-archive = ".tar.gz"
# The shell completion files to put in each archive
include = ["completions/"]
# A pull request runs `dist plan` to check the release config
pr-run-mode = "plan"
