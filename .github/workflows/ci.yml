name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, so that check-emails can scan all commits.
          fetch-depth: 0
          # Check out the PR head, not the merge commit that GitHub makes.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # The shell-init tests source the output in real shells.
      - name: Install zsh and fish (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - uses: jdx/mise-action@v3
      - uses: Swatinem/rust-cache@v2
      - run: mise run ci
        env:
          # A shell in this list must be present, or the shell-init tests fail.
          CCX_TEST_SHELLS: ${{ runner.os == 'Linux' && 'zsh,bash,fish' || 'zsh,bash' }}
