[package]
name = "ccx"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Launch Claude Code on the least-used of several accounts"
license = "MIT"
repository = "https://github.com/TheTechChild/ccx"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive", "string"] }
clap_complete = "4"
dialoguer = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.25"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
