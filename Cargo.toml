[package]
name = "ccx"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Launch Claude Code on the least-used of several accounts"
license = "MIT"
repository = "https://github.com/TheTechChild/ccx"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
